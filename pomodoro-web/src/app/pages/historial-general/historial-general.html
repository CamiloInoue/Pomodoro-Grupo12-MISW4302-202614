<section class="page">
  <button type="button" class="page__link" (click)="goBack()">← Volver</button>
  <p class="page__eyebrow">Historial</p>
  <h1 class="page__title">Historial</h1>

  <div class="filters">
    <label class="filters__field">
      <span class="filters__label">Periodo</span>
      <select class="filters__input">
        @for (periodo of periodos; track periodo) {
          <option [value]="periodo">{{ periodo }}</option>
        }
      </select>
    </label>

    <label class="filters__field">
      <span class="filters__label">Actividad</span>
      <select class="filters__input">
        @for (actividad of actividades; track actividad) {
          <option [value]="actividad">{{ actividad }}</option>
        }
      </select>
    </label>
  </div>

  <div class="session-list">
    @for (sesion of sesiones; track sesion.fecha) {
      <article class="session">
        <span class="session__name">{{ sesion.fecha }} — {{ sesion.actividad }}</span>
        <span class="session__meta">
          <span class="session__time">{{ sesion.duracion }}</span>
          <span
            class="badge"
            [class.badge--completa]="sesion.completa"
            [class.badge--incompleta]="!sesion.completa"
          >
            {{ sesion.completa ? 'Completa' : 'Incompleta' }}
          </span>
        </span>
      </article>
    }
  </div>

  <a class="page__link" routerLink="/historial-filtrado">
    Ver filtrado por "{{ actividadDestacada }}" →
  </a>
</section>
